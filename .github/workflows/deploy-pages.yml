name: Deploy to GitHub Pages

# Builds the static web app under /<repo-name>/ and publishes it to the
# gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo-name>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci rejects this lockfile because of an npm bug with bundled deps in
      # @tailwindcss/oxide-wasm32-wasi (@emnapi/*). npm install honours the
      # lockfile versions and works.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy ${{ github.sha }}"
